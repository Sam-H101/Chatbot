# The test suite on every push and pull request. Tests use fakes for Claude and Ollama, so
# they need no API key, GPU, Docker or network once the packages are installed.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      # The app's requirements plus what the tests add (the same as the local test run).
      - run: pip install -r requirements.txt pytest pillow
      # python -m puts the repo on the path, so the tests can import the app package.
      - run: python -m pytest -q
