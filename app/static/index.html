<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Chatbot</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --accent: #c2410c; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  h1 { font-size: 17px; margin: 0 0 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; margin: 20px 0 6px; }
  input, button, textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  input, textarea { width: 100%; }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .doc { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }
  .doc b { display: block; overflow-wrap: anywhere; }
  .doc small, .muted { opacity: .7; font-size: 12px; }
  .doc a { float: right; cursor: pointer; opacity: .6; }
  #log { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 760px; margin: 0 auto 14px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { background: #8882; }
  .bot { border: 1px solid var(--line); }
  .err { color: #dc2626; }
  form#ask { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; height: auto; } aside { border-right: 0; border-bottom: 1px solid var(--line); } main { height: 80vh; } }
</style>
</head>
<body>
<aside>
  <h1>Document Chatbot</h1>
  <h2>Claude API key</h2>
  <input id="key" type="password" placeholder="sk-ant-…" autocomplete="off">
  <div class="muted">Kept in this browser only and sent with each request.</div>

  <h2>Upload</h2>
  <input id="file" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv,.json,.html,.xml,.log,.py,.js,text/*">
  <div id="status" class="muted"></div>

  <h2>Metadata base</h2>
  <input id="q" type="search" placeholder="Search documents…">
  <div id="docs"></div>
</aside>
<main>
  <div id="log"><div class="msg bot">Upload documents on the left, then ask about them.</div></div>
  <form id="ask">
    <input id="question" placeholder="Ask a question…" autocomplete="off" required>
    <button>Send</button>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
const key = $('key');
key.value = localStorage.getItem('claudeKey') || '';
key.oninput = () => localStorage.setItem('claudeKey', key.value);
let history = [];

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'X-API-Key': key.value, ...(opts.headers || {}) } });
  const data = res.status === 204 ? null : await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) throw new Error(data?.error || res.statusText);
  return data;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

async function loadDocs() {
  const q = $('q').value.trim();
  const [docs, hits] = await Promise.all([
    api('/api/documents' + (q ? '?q=' + encodeURIComponent(q) : '')),
    q ? api('/api/search?q=' + encodeURIComponent(q)) : [],
  ]);
  const box = $('docs');
  box.replaceChildren();
  if (!docs.length && !hits.length) box.append(el('div', 'muted', q ? 'No matches.' : 'No documents yet.'));
  for (const d of docs) {
    const card = el('div', 'doc');
    const del = el('a', '', '✕');
    del.title = 'Delete';
    del.onclick = async () => { await api('/api/documents/' + d.id, { method: 'DELETE' }); loadDocs(); };
    card.append(del, el('b', '', d.title || d.filename),
      el('small', '', `${d.filename} · ${d.doc_type || 'unanalyzed'} · ${d.char_count.toLocaleString()} chars`),
      el('div', '', d.summary), el('small', '', d.keywords));
    if (d.analysis !== 'full') card.append(el('div', 'muted', 'Analysis: ' + d.analysis));
    box.append(card);
  }
  if (hits.length) box.append(el('h2', '', 'Matching passages'));
  for (const h of hits) {
    const card = el('div', 'doc');
    card.append(el('small', '', `${h.filename} · part ${h.idx + 1}`), el('div', '', h.snippet));
    box.append(card);
  }
}

$('file').onchange = async e => {
  for (const f of e.target.files) {
    $('status').textContent = `Analyzing ${f.name}…`;
    const body = new FormData();
    body.append('file', f);
    try { await api('/api/upload', { method: 'POST', body }); $('status').textContent = `Added ${f.name}`; }
    catch (err) { $('status').textContent = `${f.name}: ${err.message}`; }
    loadDocs();
  }
  e.target.value = '';
};

let timer;
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(loadDocs, 200); };

function say(cls, text) {
  const m = el('div', 'msg ' + cls, text);
  $('log').append(m);
  $('log').scrollTop = $('log').scrollHeight;
  return m;
}

$('ask').onsubmit = async e => {
  e.preventDefault();
  const question = $('question').value.trim();
  if (!question) return;
  $('question').value = '';
  say('user', question);
  const pending = say('bot muted', 'Thinking…');
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const r = await api('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, history }),
    });
    history.push(...r.turns);
    pending.className = 'msg bot';
    pending.textContent = r.answer;
    const u = r.usage;
    pending.append(el('div', 'muted',
      `\n${r.sources.length ? 'Sources: ' + r.sources.join(', ') + ' · ' : ''}` +
      `tokens in ${u.input} / out ${u.output} / cache read ${u.cache_read} / cache write ${u.cache_write}`));
  } catch (err) {
    pending.className = 'msg bot err';
    pending.textContent = err.message;
  }
  btn.disabled = false;
};

loadDocs();
</script>
</body>
</html>
